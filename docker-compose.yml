version: '3.8'

# Optimized Docker Compose for Moodle
# Server: 20 cores, 40GB RAM
# Load: 1500 users, 400 peak concurrent
# Last updated: 2026-02-10

services:
  mariadb:
    image: bitnami/mariadb:11.2
    container_name: moodle_mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=SEDO3482389D4
      - MARIADB_USER=alirezabb
      - MARIADB_PASSWORD=SEDO3482389D4
      - MARIADB_DATABASE=siad
      - MARIADB_LOG_QUERIES=OFF
    volumes:
      - mariadb_data:/bitnami/mariadb
      - ./mariadb.my.cnf:/opt/bitnami/mariadb/conf/my_custom.cnf:ro

  redis:
    image: redis:alpine
    container_name: moodle_redis
    restart: unless-stopped
    command: redis-server --requirepass kali --maxmemory 4096mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data

  
  # [OFFICIAL PHP-FPM ARCHITECTURE]: کانتینر رسمی مودل با PHP 8.2-FPM به جای بیتنامی
  # اتصال از طریق FastCGI پورت ۹۰۰۰ به Nginx جهت بالاترین پرفورمنس
  moodle:
    image: moodle_fpm:latest
    build:
      context: ./docker/moodle-fpm
      dockerfile: Dockerfile
    container_name: moodle_fpm
    restart: unless-stopped 
    expose:
      - "9000"
    extra_hosts:
      - "joinin.ir:185.37.54.19"
      - "join.jz.ac.ir:185.37.54.19"
      - "api0.joinin.ir:185.37.54.19"
      - "api.joinin.ir:185.37.54.19"
      - "faryan.cloud:185.37.54.19"
    environment:
      # ===== DATABASE CONFIG =====
      - MOODLE_DATABASE_TYPE=${DB_TYPE:-mariadb}
      - MOODLE_DATABASE_HOST=${DB_HOST:-mariadb}
      - MOODLE_DATABASE_PORT_NUMBER=${DB_PORT:-3306}
      - MOODLE_DATABASE_USER=${DB_USER:-alirezabb}
      - MOODLE_DATABASE_PASSWORD=${DB_PASSWORD:-SEDO3482389D4}
      - MOODLE_DATABASE_NAME=${DB_NAME:-siad}
      - MOODLE_DATABASE_PREFIX=${DB_PREFIX:-mdl_}

      # ===== ADMIN CREDENTIALS =====
      - MOODLE_ADMIN=${MOODLE_ADMIN_USER:-admin1}
      - MOODLE_EMAIL=${MOODLE_ADMIN_EMAIL:-work.alirezamosleh@gmail.com}
      - MOODLE_SITE_NAME=${MOODLE_SITE_NAME:-سامانه سیاد}

      # ===== SITE URL & PROXY =====
      - MOODLE_HOST=${MOODLE_HOST:-localhost:8080}
      - MOODLE_URL=${MOODLE_URL:-http://localhost:8080}
      - MOODLE_REVERSEPROXY=${MOODLE_REVERSEPROXY:-no}
      - MOODLE_SSLPROXY=${MOODLE_SSLPROXY:-no}
      - MOODLE_DATAROOT=/var/moodledata

      # ===== REDIS SESSION =====
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-kali}
    volumes:
      - ./html:/var/www/html:rw
      - moodledata_data:/var/moodledata:rw
    depends_on:
      - mariadb
      - redis

  # Moodle Cron - Scheduled background tasks via official PHP-FPM
  moodle-cron:
    image: moodle_fpm:latest
    container_name: moodle_cron
    restart: unless-stopped
    command: ["cron"]
    environment:
      - MOODLE_DATABASE_TYPE=${DB_TYPE:-mariadb}
      - MOODLE_DATABASE_HOST=${DB_HOST:-mariadb}
      - MOODLE_DATABASE_PORT_NUMBER=${DB_PORT:-3306}
      - MOODLE_DATABASE_USER=${DB_USER:-alirezabb}
      - MOODLE_DATABASE_PASSWORD=${DB_PASSWORD:-SEDO3482389D4}
      - MOODLE_DATABASE_NAME=${DB_NAME:-siad}
      - MOODLE_DATABASE_PREFIX=${DB_PREFIX:-mdl_}
      - MOODLE_ADMIN=${MOODLE_ADMIN_USER:-admin1}
      - MOODLE_HOST=${MOODLE_HOST:-localhost:8080}
      - MOODLE_URL=${MOODLE_URL:-http://localhost:8080}
      - MOODLE_REVERSEPROXY=${MOODLE_REVERSEPROXY:-no}
      - MOODLE_SSLPROXY=${MOODLE_SSLPROXY:-no}
      - MOODLE_DATAROOT=/var/moodledata
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-kali}
    volumes:
      - ./html:/var/www/html:rw
      - moodledata_data:/var/moodledata:rw
    depends_on:
      - moodle
      - redis

  # [INTEGRATION - FASTAPI SSO & AUTH]:
  # سرویس احراز هویت ورود یکپارچه، کد ملی، OTP پیامک و اتصال به درگاه دولت‌من
  # پورت اختصاصی ۸۰۱۶ روی هاست پابلیش شده و با افزونه auth_sadaa مودل هماهنگ است.
  # FastAPI Smart Auth & SSO Service (Moodle OAuth2/OIDC & Fast Login)
  fastapi_auth:
    image: moodle_fastapi_auth:latest
    build:
      context: ./fastapi_auth
      dockerfile: Dockerfile
    container_name: moodle_fastapi_auth
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    env_file:
      - ./fastapi_auth/.env
    expose:
      - "8000"
    ports:
      - "8016:8000"
    volumes:
      - ./fastapi_auth/app:/app/app
    depends_on:
      - mariadb
      - moodle

  # Greenlight data services are isolated from Moodle's MariaDB/Redis stack.
  greenlight-postgres:
    image: docker.arvancloud.ir/postgres:14-alpine3.20
    container_name: gl-nginx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: greenlight-v3-production
    volumes:
      - greenlight_postgres_data:/var/lib/postgresql/data

  greenlight-redis:
    image: docker.arvancloud.ir/redis:6.2-alpine3.20
    container_name: gl-nginx-redis
    restart: unless-stopped
    volumes:
      - greenlight_redis_data:/data

  greenlight-v3:
    image: docker.arvancloud.ir/bigbluebutton/greenlight:v3
    container_name: gl-nginx-app
    entrypoint: [bin/start]
    restart: unless-stopped
    env_file: ./greenlight/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@greenlight-postgres:5432/greenlight-v3-production
      REDIS_URL: redis://greenlight-redis:6379
    expose:
      - "3000"
    ports:
      - "${GREENLIGHT_PORT:-3000}:3000"
    logging:
      driver: ${LOGGING_DRIVER:-json-file}
    volumes:
      - ./data/storage:/usr/src/app/storage
      # Behind nginx TLS: trust X-Forwarded-* and use secure cookies
      - ./greenlight/config/initializers/session_store.rb:/usr/src/app/config/initializers/session_store.rb:ro
      - ./greenlight/config/initializers/zz_trust_proxy.rb:/usr/src/app/config/initializers/zz_trust_proxy.rb:ro
      - ./greenlight/config/initializers/zz_relax_csrf_origin.rb:/usr/src/app/config/initializers/zz_relax_csrf_origin.rb:ro
      - ./greenlight/config/initializers/zz_csrf_api_rescue.rb:/usr/src/app/config/initializers/zz_csrf_api_rescue.rb:ro
      - ./greenlight/config/controllers/sessions_controller.rb:/usr/src/app/app/controllers/api/v1/sessions_controller.rb:ro
      - ./greenlight/config/controllers/components_controller.rb:/usr/src/app/app/controllers/components_controller.rb:ro
      - ./greenlight/config/controllers/recordings_controller.rb:/usr/src/app/app/controllers/api/v1/recordings_controller.rb:ro
      - ./greenlight/config/controllers/rooms_controller.rb:/usr/src/app/app/controllers/api/v1/rooms_controller.rb:ro
      - ./greenlight/config/controllers/authorizable.rb:/usr/src/app/app/controllers/concerns/authorizable.rb:ro
      # JoinIN BBB: meeting passwords (role= join is rejected)
      - ./greenlight/config/services/big_blue_button_api.rb:/usr/src/app/app/services/big_blue_button_api.rb:ro
      - ./greenlight/config/services/recording_catalog_sync.rb:/usr/src/app/app/services/recording_catalog_sync.rb:ro
      - ./greenlight/config/services/recording_creator.rb:/usr/src/app/app/services/recording_creator.rb:ro
      # ./greenlight/da branding / Persian / RTL
      - ./greenlight/custom/locales/fa_IR.json:/usr/src/app/app/assets/locales/fa_IR.json:ro
      - ./greenlight/custom/locales/fa.json:/usr/src/app/app/assets/locales/fa.json:ro
      - ./greenlight/custom/locales/en.json:/usr/src/app/app/assets/locales/en.json:ro
      - ./greenlight/custom/locales/fa.json:/usr/src/app/public/assets/fa-5156d0fe2bf15e3da11cb5d8ac2bb1adf00e29a17eecee3ed27c2b46654bbf8d.json:ro
      - ./greenlight/custom/locales/fa_IR.json:/usr/src/app/public/assets/fa_IR-5156d0fe2bf15e3da11cb5d8ac2bb1adf00e29a17eecee3ed27c2b46654bbf8d.json:ro
      - ./greenlight/config/controllers/locales_controller.rb:/usr/src/app/app/controllers/api/v1/locales_controller.rb:ro
      - ./greenlight/custom/application.html.erb:/usr/src/app/app/views/layouts/application.html.erb:ro
      - ./greenlight/custom/fonts:/usr/src/app/public/fonts:ro
      - ./greenlight/custom/hoda-theme.css:/usr/src/app/public/hoda-theme.css:ro
      - ./greenlight/custom/styles:/usr/src/app/public/styles:ro
      - ./greenlight/custom/custom-overrides.css:/usr/src/app/public/custom-overrides.css:ro
      - ./greenlight/custom/rtl-fix.js:/usr/src/app/public/rtl-fix.js:ro
      - ./greenlight/custom/assets/logo-hoda.png:/usr/src/app/public/hoda-logo.png:ro
      - ./greenlight/custom/assets/favicon.png:/usr/src/app/public/hoda-favicon.png:ro
      - ./greenlight/custom/assets/logo.svg:/usr/src/app/public/hoda-logo.svg:ro
      - ./greenlight/custom/assets/logo-lockup.svg:/usr/src/app/public/hoda-logo-lockup.svg:ro
      - ./greenlight/custom/react/App.jsx:/usr/src/app/app/javascript/App.jsx:ro
      - ./greenlight/custom/react/home/HomePage.jsx:/usr/src/app/app/javascript/components/home/HomePage.jsx:ro
      - ./greenlight/custom/react/home/HomepageFeatureCard.jsx:/usr/src/app/app/javascript/components/home/HomepageFeatureCard.jsx:ro
      - ./greenlight/custom/react/shared_components/Header.jsx:/usr/src/app/app/javascript/components/shared_components/Header.jsx:ro
      - ./greenlight/custom/react/shared_components/Footer.jsx:/usr/src/app/app/javascript/components/shared_components/Footer.jsx:ro
      - ./greenlight/custom/react/shared_components/Logo.jsx:/usr/src/app/app/javascript/components/shared_components/Logo.jsx:ro
      - ./greenlight/custom/react/helpers/LocaleHelper.js:/usr/src/app/app/javascript/helpers/LocaleHelper.js:ro
      - ./greenlight/custom/react/home/NavbarSignedIn.jsx:/usr/src/app/app/javascript/components/home/NavbarSignedIn.jsx:ro
      - ./greenlight/custom/react/home/NavbarNotSignedIn.jsx:/usr/src/app/app/javascript/components/home/NavbarNotSignedIn.jsx:ro
      - ./greenlight/custom/react/home/AuthButtons.jsx:/usr/src/app/app/javascript/components/home/AuthButtons.jsx:ro
      - ./greenlight/custom/react/rooms/Rooms.jsx:/usr/src/app/app/javascript/components/rooms/Rooms.jsx:ro
      - ./greenlight/custom/react/rooms/RoomCard.jsx:/usr/src/app/app/javascript/components/rooms/RoomCard.jsx:ro
      - ./greenlight/custom/react/rooms/room/Room.jsx:/usr/src/app/app/javascript/components/rooms/room/Room.jsx:ro
      - ./greenlight/custom/react/users/authentication/SignIn.jsx:/usr/src/app/app/javascript/components/users/authentication/SignIn.jsx:ro
      - ./greenlight/custom/react/users/authentication/Signup.jsx:/usr/src/app/app/javascript/components/users/authentication/Signup.jsx:ro
      - ./greenlight/custom/dist/hoda-main.js:/usr/src/app/public/assets/main-f23e94fa0f0782a3fefe645cf95e75d6b53d1311a4af188d650b791e35c0e38b.js:ro
    depends_on:
      - greenlight-postgres
      - greenlight-redis


  recordings-sync:
    image: docker.arvancloud.ir/bigbluebutton/greenlight:v3
    container_name: gl-nginx-recordings-sync
    entrypoint: ["/bin/sh", "-c"]
    command: ["bundle exec rails runner /usr/src/app/custom/recordings_sync_worker.rb"]
    restart: unless-stopped
    env_file: ./greenlight/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@greenlight-postgres:5432/greenlight-v3-production
      REDIS_URL: redis://greenlight-redis:6379
      RECORDINGS_SYNC_INTERVAL: "120"
      RECORDINGS_FULL_SYNC_EVERY: "5"
    volumes:
      - ./greenlight/config/services/big_blue_button_api.rb:/usr/src/app/app/services/big_blue_button_api.rb:ro
      - ./greenlight/config/services/recording_catalog_sync.rb:/usr/src/app/app/services/recording_catalog_sync.rb:ro
      - ./greenlight/config/services/recording_creator.rb:/usr/src/app/app/services/recording_creator.rb:ro
      - ./greenlight/custom/recordings_sync_worker.rb:/usr/src/app/custom/recordings_sync_worker.rb:ro
    depends_on:
      - greenlight-postgres
      - greenlight-redis


  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: moodle_nginx
    restart: unless-stopped
      #network_mode: host
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
      - "${MOODLE_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./html:/var/www/html:ro
      - moodledata_data:/var/moodledata:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx:rw   
      #greenlight
      - ./greenlight/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - moodle
      - greenlight-v3
      - fastapi_auth


volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  moodledata_data:
    driver: local
  greenlight_postgres_data:
    driver: local
  greenlight_redis_data:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local

# Optional: Add networks for better isolation
networks:
  default:
    driver: bridge

