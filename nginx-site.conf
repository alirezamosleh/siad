# Optimized Nginx Site Configuration for Moodle
# Server: 20 cores, 40GB RAM
# Architecture: Native PHP 8.2-FPM + Nginx FastCGI
# Last updated: 2026-02-11

# Upstream to Moodle application - PHP-FPM FastCGI
upstream moodle_fpm {
    server moodle:9000;
    keepalive 64;
}

# Greenlight application (added alongside Moodle; Moodle routes remain unchanged).
upstream greenlight_app {
    server greenlight-v3:3000;
    keepalive 32;
}

# [INTEGRATION]: تعریف آپ‌استریم سرویس ورود یکپارچه فست‌ای‌پی‌آی (FastAPI SSO Service)
# FastAPI Authentication & SSO Service
upstream fastapi_auth_app {
    server fastapi_auth:8000;
    keepalive 32;
}

# [LOCAL DEV]: بلاک سرور توسعه محلی برای دسترسی مستقیم با localhost و 127.0.0.1
# Local development HTTP entry point for localhost
server {
    listen 80;
    listen 8080;
    server_name localhost 127.0.0.1 "";

    root /var/www/html;
    index index.php index.html index.htm;

    # Logging
    access_log /var/log/nginx/moodle_access.log performance;
    error_log /var/log/nginx/moodle_error.log;

    client_max_body_size 512M;
    client_body_timeout 300s;

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to FastCGI
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_pass moodle_fpm;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
    }

    # Serve moodledata files directly (if needed)
    location /moodledata/ {
        internal;
        alias /var/moodledata/;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /config\.php$ {
        deny all;
        access_log off;
    }

    location ~ /\.(git|svn|hg) {
        deny all;
        access_log off;
    }

    location ~ \.(bak|save|old|backup|swp)$ {
        deny all;
        access_log off;
    }
}

server {
    listen 80;
    server_name embed.hu.jz.ac.ir;

    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Greenlight HTTP entry point.
server {
    listen 80;
    server_name sakoo.hu.jz.ac.ir;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name siad.hu.jz.ac.ir;
    
    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;  
    server_name siad.hu.jz.ac.ir;
    
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    root /var/www/html;
    index index.php index.html index.htm;

    # SSL Configuration (use Let's Encrypt certificates)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    # ssl_stapling on;
    # ssl_stapling_verify on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Logging
    access_log /var/log/nginx/moodle_access.log performance;
    error_log /var/log/nginx/moodle_error.log;
    
    # Max upload size
    client_max_body_size 512M;
    client_body_timeout 300s;
    
    # Root location
    location / {
        limit_req zone=general_limit burst=100 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to FastCGI
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_pass moodle_fpm;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
    }

    # BigBlueButtonBN integration unbuffered streaming
    location ~ ^/mod/bigbluebuttonbn/.*\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_pass moodle_fpm;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_buffering off;
        fastcgi_request_buffering off;
        fastcgi_read_timeout 600s;
    }

    # Login rate limiting
    location ~ ^/login/index\.php {
        limit_req zone=login_limit burst=5 nodelay;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_pass moodle_fpm;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
    }
    
    # API endpoints (for BBB and web services)
    location ~ ^/(webservice|local/webservices)/ {
        limit_req zone=api_limit burst=20 nodelay;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_pass moodle_fpm;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 600s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
    }
    
    # Cache static assets - served directly from /var/www/html
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Cache CSS and JavaScript
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Cache fonts
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 90d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin *;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM status (for monitoring)
    location ~ ^/(fpm-status|fpm-ping)$ {
        access_log off;
        allow 127.0.0.1;
        deny all;
        fastcgi_pass moodle_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    
    # Serve moodledata files directly (if needed)
    location /moodledata/ {
        internal;
        alias /var/moodledata/;
    }
    
    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /config\.php$ {
        deny all;
        access_log off;
    }
    
    # Deny access to version control
    location ~ /\.(git|svn|hg) {
        deny all;
        access_log off;
    }
    
    # Deny access to backup files
    location ~ \.(bak|save|old|backup|swp)$ {
        deny all;
        access_log off;
    }
}

# Greenlight HTTPS entry point.
server {
    listen 443 ssl;
    http2 on;
    server_name sakoo.hu.jz.ac.ir;

    # Use the same certificate directory as the existing HTTPS service.
    # The certificate must include sakoo.hu.jz.ac.ir.
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 100M;

    location / {
        proxy_pass http://greenlight_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# FastAPI Auth Service HTTP entry point
server {
    listen 80;
    server_name auth.hu.jz.ac.ir;

    location / {
        return 301 https://$host$request_uri;
    }
}

# FastAPI Auth Service HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name auth.hu.jz.ac.ir;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    location / {
        proxy_pass http://fastapi_auth_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /static/ {
        proxy_pass http://fastapi_auth_app/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
