# Optimized Nginx Site Configuration for Moodle
# Server: 8 cores, 16GB RAM
# Load: 1500 users, 400 peak concurrent
# Last updated: 2026-02-10
# FIX: Using HTTPS backend (port 8443) to properly set SERVER_PORT

# Upstream to Moodle application - USING HTTPS PORT
upstream moodle_app {
    server moodle:8080;  # CHANGED FROM 8080 TO 8443
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Greenlight application (added alongside Moodle; Moodle routes remain unchanged).
upstream greenlight_app {
    server greenlight-v3:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name embed.hu.jz.ac.ir;

    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Greenlight HTTP entry point.
server {
    listen 80;
    server_name sakoo.hu.jz.ac.ir;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name siad.hu.jz.ac.ir ;
    
    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;  
    server_name siad.hu.jz.ac.ir;
    
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    root /var/www/html;

    # SSL Configuration (use Let's Encrypt certificates)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    # ssl_stapling on;
    # ssl_stapling_verify on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Logging
    access_log /var/log/nginx/moodle_access.log performance;
    error_log /var/log/nginx/moodle_error.log;
    
    # Max upload size (from map)
    client_max_body_size 512M;
    client_body_timeout 300s;
    
    # Root location
    location / {
        limit_req zone=general_limit burst=100 nodelay;
        
        proxy_pass http://moodle_app; 
        proxy_http_version 1.1;
        
        # SSL proxy settings - ADDED FOR HTTPS BACKEND
	#proxy_ssl_verify off;  # Self-signed cert on backend
	#proxy_ssl_server_name on;
        
        # Proxy headers
        proxy_set_header Host moodle-internal;
        #proxy_set_header HTTPS on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        #proxy_set_header X-Forwarded-Ssl on;
        
        # Connection reuse
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering (matches optimized settings)
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
   
    }

   location /mod/bigbluebuttonbn/ {
    proxy_pass http://moodle_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    #proxy_ssl_verify off; # Needed for your self-signed backend cert
    proxy_set_header Host moodle-internal;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_request_buffering off;
} 

    # Login rate limiting
    location ~ ^/login/index\.php {
        limit_req zone=login_limit burst=5 nodelay;
        
        proxy_pass http://moodle_app; 
        proxy_http_version 1.1;
        
        # SSL proxy settings
	#proxy_ssl_verify off;
	#pproxy_ssl_roxy_ssl_server_name on;
        
        proxy_set_header Host moodle-internal;
        #proxy_set_header HTTPS on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
    }
    
    # API endpoints (for BBB and web services)
    location ~ ^/(webservice|local/webservices)/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://moodle_app;  # CHANGED FROM http:// TO httpe://
        proxy_http_version 1.1;
        
        # SSL proxy settings
	#proxy_ssl_verify off;
	#proxy_ssl_server_name on;
        
        proxy_set_header Host moodle-internal;
        #proxy_set_header HTTPS on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        
        # Longer timeouts for API calls
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
    
    # Cache static assets - OPTIMIZED
location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
    proxy_pass http://moodle_app; 
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    
    # این header ها را اضافه کنید:
    proxy_set_header Host moodle-internal;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    
    proxy_cache moodle_cache;
    proxy_cache_valid 200 304 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_bypass $http_pragma $http_authorization;
    proxy_no_cache $http_pragma $http_authorization;
    add_header X-Cache-Status $upstream_cache_status;
    expires 30d;
    access_log off;
}

    
# Cache CSS and JavaScript
location ~* \.(css|js)$ {
    proxy_pass http://moodle_app; 
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    
    # اضافه کردن header های کامل
    proxy_set_header Host moodle-internal;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    
    proxy_cache moodle_cache;
    proxy_cache_valid 200 304 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_bypass $http_pragma $http_authorization;
    proxy_no_cache $http_pragma $http_authorization;
    add_header X-Cache-Status $upstream_cache_status;
    expires 7d;
    access_log off;
}

# Cache fonts
location ~* \.(woff|woff2|ttf|eot|otf)$ {
    proxy_pass http://moodle_app; 
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    
    # اضافه کردن header های کامل
    proxy_set_header Host moodle-internal;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    
    proxy_cache moodle_cache;
    proxy_cache_valid 200 304 90d;
    proxy_cache_bypass $http_pragma $http_authorization;
    proxy_no_cache $http_pragma $http_authorization;
    add_header X-Cache-Status $upstream_cache_status;
    add_header Access-Control-Allow-Origin *;
    expires 90d;
    access_log off;
}

    # PHP-FPM status (for monitoring)
    location ~ ^/(fpm-status|fpm-ping)$ {
        access_log off;
        allow 127.0.0.1;
        deny all;
        
        proxy_pass http://moodle_app; 
	#proxy_ssl_verify off;
        proxy_set_header Host moodle-internal;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Serve moodledata files directly (if needed)
    location /moodledata/ {
        internal;
        alias /var/moodledata/;
    }
    
    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /config\.php$ {
        deny all;
        access_log off;
    }
    
    # Deny access to version control
    location ~ /\.(git|svn|hg) {
        deny all;
        access_log off;
    }
    
    # Deny access to backup files
    location ~ \.(bak|save|old|backup|swp)$ {
        deny all;
        access_log off;
    }
}

# Greenlight HTTPS entry point.
server {
    listen 443 ssl;
    http2 on;
    server_name sakoo.hu.jz.ac.ir;

    # Use the same certificate directory as the existing HTTPS service.
    # The certificate must include sakoo.hu.jz.ac.ir.
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 100M;

    location / {
        proxy_pass http://greenlight_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

