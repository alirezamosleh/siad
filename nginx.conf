# Optimized Nginx Configuration for Moodle
# Server: 20 cores, 40GB RAM

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format performance '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" $request_time $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 500;
    types_hash_max_size 2048;
    server_tokens off;

    # Client
    client_max_body_size 512M;
    client_body_buffer_size 256k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # Proxy defaults
    proxy_http_version 1.1;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;
    proxy_busy_buffers_size 16k;
    proxy_temp_file_write_size 16k;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/rss+xml image/svg+xml
        font/ttf font/otf font/woff font/woff2;

    # =======================
    # Cache (STATIC ONLY)
    # =======================
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=moodle_cache:100m
        max_size=2g
        inactive=60m
        use_temp_path=off;

    proxy_cache_key "$scheme$request_method$host$request_uri";

    # ⚠️ IMPORTANT:
    # HTML responses MUST bypass cache in site config

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Connection limiting (disabled per-IP connection limit to prevent blocking campus NAT users)
    # limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    # limit_conn conn_limit_per_ip 20;

    # =======================
    # Reverse proxy helpers
    # =======================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $scheme $forwarded_proto {
        default https;
    }

    map $server_port $forwarded_port {
        default 443;
    }

    include /etc/nginx/conf.d/*.conf;
}

