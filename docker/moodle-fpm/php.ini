[PHP]
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
post_max_size = 100M
upload_max_filesize = 100M

date.timezone = Asia/Tehran
expose_php = Off

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

session.gc_maxlifetime = 14400
